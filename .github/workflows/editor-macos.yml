# Сборка редактора на macOS (хранение ключа в «Связке ключей»). Запускается только при изменении редактора или вручную.
# ⚠ В закрытом репозитории минуты macOS расходуются из лимита GitHub в 10 раз быстрее минут Linux.
name: Редактор на macOS
on:
  pull_request:
    paths: ["shipedit/**", ".github/workflows/editor-macos.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Qt
        run: brew install qt
      - name: Сборка
        run: |
          cmake -S . -B build -DSDP_BUILD_EDITOR=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build -j3 --target sdp_ship sdp_run
      - name: Запуск без экрана
        run: QT_QPA_PLATFORM=offscreen ./build/shipedit/sdp_ship "data/Данные_судна_пример.xlsx" --tab 0 --screenshot снимок_macos.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos
          path: снимок_macos.png
          retention-days: 7
