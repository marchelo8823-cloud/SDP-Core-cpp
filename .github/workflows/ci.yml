# Сборка и тесты на каждое изменение. Без Claude и без секретов.
name: Сборка и тесты
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Зависимости
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ qt6-base-dev libgl1-mesa-dev libsecret-1-dev
      - name: Сборка, тесты, сценарии
        run: tools/ci_build.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-out
          path: test-out/
          retention-days: 14
